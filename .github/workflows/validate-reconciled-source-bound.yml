name: Validate reconciled source-bound draft

on:
  push:
    branches:
      - feat/source-bound-mental-model-v0-1-reconciled
    paths:
      - .github/workflows/validate-reconciled-source-bound.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/source-bound-mental-model-v0-1-reconciled
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
      - name: Validate protocol, links, and contracts
        run: |
          npm ci
          npm test
          node scripts/validate-hub-links.mjs
          npm --prefix contracts ci
          npm --prefix contracts run check
